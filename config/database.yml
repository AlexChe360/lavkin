default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: lavkin_development


test:
  <<: *default
  database: lavkin_test


production:
  primary: &primary_production
    <<: *default
    database: lavkin_production
    username: lavkin
    password: <%= ENV["LAVKIN_DATABASE_PASSWORD"] %>
    host: <%= ENV.fetch("DB_HOST", "lavkin-db") %>
    port: 5432

  cache:
    <<: *primary_production
    database: lavkin_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *primary_production
    database: lavkin_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *primary_production
    database: lavkin_production_cable
    migrations_paths: db/cable_migrate