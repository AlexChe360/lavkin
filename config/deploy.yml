service: lavkin

image: archangelleshii/lavkin


servers:
  web:
    - 213.155.20.126


proxy:
  ssl: true
  host: lavkin.kz


registry:
  username: archangelleshii
  password:
    - KAMAL_REGISTRY_PASSWORD


env:
  secret:
    - RAILS_MASTER_KEY
    - LAVKIN_DATABASE_PASSWORD
    - SMTP_USERNAME
    - SMTP_PASSWORD

  clear:
    RAILS_ENV: production
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: lavkin-db

    MAIL_FROM: "Lavkin <info@lavkin.kz>"
    SMTP_ADDRESS: smtp.yandex.ru
    SMTP_PORT: 587
    SMTP_DOMAIN: lavkin.kz


aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"


volumes:
  - "lavkin_storage:/rails/storage"


asset_path: /rails/public/assets


builder:
  arch: amd64

ssh:
  user: ubuntu


accessories:
  db:
    image: postgres:17-alpine
    host: 213.155.20.126

    env:
      clear:
        POSTGRES_USER: lavkin
        POSTGRES_DB: lavkin_production

      secret:
        - POSTGRES_PASSWORD

    directories:
      - data:/var/lib/postgresql/data